<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legendary Color Chart — Reference</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Header bar -->
<div class="titlebar">
  <h1>Legendary Color Chart</h1>
  <div class="count-badge">Total: <b id="totalCount">—</b> elements</div>
</div>

<div class="wrap">
  <!-- Toolbar: search + add button -->
  <div class="toolbar">
    <div class="search"><input id="searchInput" type="text" placeholder="Search..."></div>
    <button class="btn add-btn" id="addBtn">+ Add Color</button>
  </div>

  <!-- Sort chips -->
  <div class="sort-row">
    <button class="chip active" data-sort="alpha">A → Z</button>
    <button class="chip" data-sort="recent">Recent</button>
  </div>

  <!-- Main layout: grid (left) + detail panel (right) -->
  <div class="main-layout">
    <!-- Color grid (left) -->
    <div class="board">
      <div class="grid" id="grid"></div>
      <div class="empty" id="emptyState" style="display:none;">
        <div class="big">🐧</div>
        No elements found.
      </div>
    </div>

    <!-- Detail panel (right) -->
    <div class="detail-panel" id="detailPanel">
      <div class="detail-content">
        <div class="detail-gradient" id="detailGradient"></div>
        <div class="detail-info" id="detailInfo">
          <div class="detail-name"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal for add/edit -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" id="closeModal">✕</button>
    <h2 id="modalTitle">Add Element</h2>
    <div class="field">
      <label>Element Name</label>
      <input type="text" id="fName" placeholder="e.g. Phoenix">
    </div>
    <div class="field">
      <label>Colors (Hex codes)</label>
      <div id="colorContainer"></div>
      <button class="btn" id="addColorBtn" style="width:100%; margin-top:10px;">+ Add Color</button>
    </div>
    <div class="preview-bar" id="previewBar"></div>
    <div class="modal-actions">
      <button class="btn danger" id="deleteBtn" style="display:none;">Delete</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
